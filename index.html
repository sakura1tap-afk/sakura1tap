<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sakura1Tap 是一个由交互、运动与氛围构成的沉浸式数字世界。" />
    <meta name="theme-color" content="#030405" />
    <meta name="color-scheme" content="dark" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sakura1Tap" />
    <meta property="og:title" content="Sakura1Tap" />
    <meta property="og:description" content="一个由作品、实验、动效与持续更新的想法构成的个人空间。" />
    <meta property="og:url" content="https://www.sakura1tap.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://www.sakura1tap.com/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <title>Sakura1Tap</title>
    <script>
      // The boot entry (background art, Live2D runtime + model manifests) only exists
      // on the root route. Every other route renders an inner page, so preloading that
      // there only burns bandwidth and logs "unused preload" warnings.
      // This runs during <head> parsing, so the requests still start before the bundle.
      (function () {
        var path = location.pathname.replace(/\/+$/, '') || '/';
        if (path !== '/' && path !== '/index.html') return;

        var mobile = window.matchMedia('(max-width: 760px)').matches;
        var hints = [
          { rel: 'preload', as: 'script', href: '/vendor/live2dcubismcore.min.js' },
          { rel: 'preload', as: 'image', type: 'image/webp', href: mobile ? '/cinematic/entry-v2-mobile.webp' : '/cinematic/entry-v2.webp' },
          { rel: 'preload', as: 'fetch', crossorigin: true, href: '/live2d/WhiteAngelOriginal/%E6%97%A0%E5%8F%A3%E5%A4%A9%E4%BD%BF%205.model3.json' },
          { rel: 'preload', as: 'fetch', crossorigin: true, href: '/live2d/Fern/fern.model3.json' },
          // The homepage WebGL stage needs these two right after the enter click.
          // Prefetching them while the entry is on screen makes that transition
          // instant instead of showing the awakening veil.
          { rel: 'prefetch', as: 'image', href: mobile ? '/cinematic/scene-mobile.webp' : '/cinematic/bridge.webp' },
          { rel: 'prefetch', as: 'image', href: '/cinematic/closeup.webp' },
        ];

        hints.forEach(function (item) {
          var link = document.createElement('link');
          link.rel = item.rel;
          link.as = item.as;
          link.href = item.href;
          if (item.type) link.type = item.type;
          if (item.crossorigin) link.crossOrigin = 'anonymous';
          document.head.appendChild(link);
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
